version: "3.8"

services:
  # --- PostgreSQL Database ------------------------------------
  db:
    image: postgres:15-alpine
    container_name: techmart_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techmart_user
      POSTGRES_PASSWORD: techmart_password
      POSTGRES_DB: techmart_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techmart_user -d techmart_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Multi-Agent FastAPI Backend -----------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techmart_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://techmart_user:techmart_password@db:5432/techmart_support
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretjwtkey_techmart_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - FAISS_INDEX_PATH=./vectorstore/faiss_index.bin
      - FAISS_METADATA_PATH=./vectorstore/faiss_metadata.json
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./backend/vectorstore:/app/backend/vectorstore

  # --- Next.js Frontend ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: techmart_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
